# スペシャルモーラの ずんだもんの セリフ（VOICEVOX:ずんだもん）を つくる（一時的なブランチ mora-voice-gen に push したときだけ うごく）
name: mora-voice
on:
  push:
    branches: [mora-voice-gen]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ['50021:50021']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: wait for engine
        run: for i in $(seq 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 5; done
      - run: python3 mora/tools/voice/make_lines.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mora/source/src/assets/voice
          git commit -m "スペシャルモーラ：ずんだもんの セリフ（VOICEVOX:ずんだもん） [skip ci]" && git push origin HEAD:mora-voice-gen
