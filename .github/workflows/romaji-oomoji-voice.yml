# ローマ字フローラちゃん おおもじ の カードの ことばの 音声（VOICEVOX:小夜/SAYO）を つくる
# （一時的なブランチ romaji-oomoji-voice-gen に push したときだけ うごく。w_・s_ だけ つくる。ほかの 音声は フローラちゃんと おなじ）
name: romaji-oomoji-voice
on:
  push:
    branches: [romaji-oomoji-voice-gen]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ['50021:50021']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install numpy scipy pyworld pyloudnorm soundfile
      - name: wait for engine
        run: for i in $(seq 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 5; done
      - run: ONLY='w_*,s_*' python3 romaji-oomoji/tools/voice/make_voices.py lines
      - name: commit voices to romaji-oomoji-voice-gen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add romaji-oomoji/source/src/assets/voice romaji-oomoji/tools/voice
          git commit -m "フローラちゃん おおもじ の ことばの 音声（VOICEVOX:小夜/SAYO） [skip ci]" && git push origin HEAD:romaji-oomoji-voice-gen
