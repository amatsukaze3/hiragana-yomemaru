# しらべる用：小夜/SAYO の ためし音声（一時的なブランチ romaji-voice-exp に push したときだけ うごく）
name: romaji-voice-exp
on:
  push:
    branches: [romaji-voice-exp]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ['50021:50021']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install numpy scipy pyworld pyloudnorm soundfile
      - name: wait for engine
        run: for i in $(seq 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 5; done
      - run: python3 romaji/tools/voice/exp_voice.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add romaji/tools/voice/exp romaji/tools/voice/raw
          git commit -m "ためし音声 [skip ci]" && git push origin HEAD:romaji-voice-exp
