# ローマ字フローラちゃんの 音声（VOICEVOX:小夜/SAYO／黒沢冴白）を つくる（一時的なブランチ romaji-voice-gen に push したときだけ うごく）
name: romaji-voice
on:
  push:
    branches: [romaji-voice-gen]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ['50021:50021']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install numpy scipy pyworld pyloudnorm soundfile
      - name: wait for engine
        run: for i in $(seq 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 5; done
      - run: python3 romaji/tools/voice/make_voices.py
      - name: commit voices to romaji-voice-gen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add romaji/source/src/assets/voice romaji/source/src/data/voiceCredit.json romaji/tools/voice
          git commit -m "フローラちゃんの音声（VOICEVOX:小夜/SAYO） [skip ci]" && git push origin HEAD:romaji-voice-gen
